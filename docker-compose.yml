version: '3.8'

services:

  db:
    image: postgres:15-alpine
    container_name: mundoinvest_db
    restart: always

    env_file:
      - .env.prod

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: mundoinvest_api
    restart: always

    env_file:
      - .env.prod

    ports:
      - "8000:8000"

    depends_on:
      db:
        condition: service_healthy

    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

volumes:
  postgres_data: